# ==========================================================================
# Aircraft parameters: F-16 (simplified model)
# ==========================================================================
# SI units, EXCEPT keys suffixed _deg / _deg_s (degrees, converted on load).
#
# Sources:
#   [SL]   Stevens, Lewis & Johnson, "Aircraft Control and Simulation" (F-16 model,
#          itself taken from Nguyen et al., NASA TP-1538, 1979). Original values in imperial
#          units, recalled in comments.
#   [PUB]  Public orders of magnitude (manufacturer / US Air Force fact sheets).
#   [EST]  Project estimate, chosen to give plausible performance.
#          To be refined: these are the values to tune if the flight envelope is unrealistic.
# ==========================================================================

name: F-16 (simplified)

geometry:
  wing_area: 27.87          # [SL] S = 300 ft²
  wing_span: 9.144          # [SL] b = 30 ft
  mean_chord: 3.450         # [SL] c̄ = 11.32 ft

mass:
  mass: 9295.44             # [SL] 1/m = 1.57e-3 slug⁻¹ (≈ 20 490 lb)
  # Inertias (used from phase 3 onward)
  Ixx: 12874.8              # [SL]  9 496 slug·ft²
  Iyy: 75673.6              # [SL] 55 814 slug·ft²
  Izz: 85552.1              # [SL] 63 100 slug·ft²
  Ixz: 1331.4               # [SL]    982 slug·ft²

propulsion:
  # Simplified model of an afterburning turbofan.
  # Static thrust at sea level [SL] (F100 engine from the Stevens & Lewis model):
  thrust_idle_sl: 4715.0    # [SL]  1 060 lbf
  thrust_mil_sl: 56404.0    # [SL] 12 680 lbf  (full dry power)
  thrust_max_sl: 88964.0    # [SL] 20 000 lbf  (full afterburner)
  mil_power: 0.77           # [SL] throttle position corresponding to full dry power
  # Altitude effect: T ∝ (ρ/ρ0)^n
  density_exponent: 1.15    # [SL] fitted to the tables' static thrusts 0–50 000 ft
  # Ram effect: T ∝ (1 + k·M), bounded by ram_limit × static sea-level thrust
  ram_factor_mil: 0.20      # [EST]
  ram_factor_max: 1.10      # [EST] tuned for ≈ Mach 2 at 11 km
  ram_limit: 1.30           # [EST] tuned for ≈ Mach 1.2–1.3 at sea level
  engine_time_constant: 1.0 # [EST] engine spool response [s]

aero_polar:
  # Drag polar used by the point-mass model (phase 2):
  #   CL = CL0 + CLα(M)·α        CD = CD0(M) + k(M)·CL²
  CL0: 0.10                 # [SL] CZ(α=0) ≈ −0.10 in the model tables
  CLalpha: 3.5              # [SL] low-speed slope ≈ 0.061 /deg between 0 and 25°  [1/rad]
  mach:          [0.00,  0.60,  0.80,  0.90,  1.00,  1.20,  1.50,  2.00]
  clalpha_scale: [1.00,  1.05,  1.15,  1.20,  1.15,  1.00,  0.80,  0.65]   # [EST] compressibility
  cd0:           [0.0175, 0.0175, 0.0180, 0.0220, 0.0380, 0.0420, 0.0400, 0.0370]  # [EST] clean
  k_induced:     [0.13,  0.13,  0.14,  0.16,  0.20,  0.26,  0.33,  0.42]   # [EST] AR ≈ 3, e ≈ 0.8

limits:
  n_max: 9.0                # [PUB] max load factor
  n_min: -3.0               # [PUB]
  alpha_max_deg: 25.0       # [PUB] angle-of-attack limiter of the fly-by-wire flight controls
  alpha_min_deg: -10.0      # [EST]
  roll_rate_max_deg_s: 240.0  # [EST] max commandable roll rate
  mach_max: 2.0             # [PUB]
  ceiling: 15240.0          # [PUB] service ceiling 50 000 ft

# Control dynamics of the point-mass model (aircraft response + flight controls)
point_mass_response:
  alpha_time_constant: 0.25       # [EST] ≈ damped short-period oscillation [s]
  alpha_rate_max_deg_s: 40.0      # [EST]
  roll_time_constant: 0.20        # [EST] [s]

# 6-DOF model (phase 3)
six_dof:
  tables_file: f16_sl_tables.yaml   # Stevens & Lewis aero + engine tables (same folder)
  xcg_ref: 0.35             # [SL] reference CG position of the tables (fraction of c̄)
  xcg: 0.30                 # [EST] chosen CG position: naturally stable aircraft (option (a) of the roadmap).
                            # 0.35 = Stevens & Lewis nominal, slightly UNSTABLE in pitch (like the real F-16)
  actuator_time_constant: 0.0495  # [SL] actuators: first order at 20.2 rad/s

# Control surfaces — deflections and rates [SL]
control_surfaces:
  elevator: {min_deg: -25.0, max_deg: 25.0, rate_max_deg_s: 60.0}
  aileron:  {min_deg: -21.5, max_deg: 21.5, rate_max_deg_s: 80.0}
  rudder:   {min_deg: -30.0, max_deg: 30.0, rate_max_deg_s: 120.0}

# Flight envelope: beyond it, the flight is lost (end of episode for learning)
envelope:
  min_altitude: 0.0         # [m] ground (flat terrain)
  max_altitude: 17000.0     # [m] beyond the model's ceiling
  min_airspeed: 50.0        # [m/s] minimum true airspeed (well below stall speed)
  max_mach: 2.0             # [PUB] F-16 max Mach
  n_max: 10.0               # [EST] structural limit: 9 g from the flight controls + margin
  n_min: -4.0               # [EST]
  alpha_stall_deg: 30.0     # [EST] stall angle of attack (beyond the 25° limiter)
  stall_duration: 2.0       # [EST] time tolerated beyond alpha_stall [s]
  beta_max_deg: 30.0        # [SL] domain of the aero tables
  # The 6-DOF model (tables without Mach effect) is limited to subsonic flight
  six_dof_overrides:
    max_mach: 0.95
