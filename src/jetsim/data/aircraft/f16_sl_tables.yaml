# ==========================================================================
# F-16 aerodynamic and engine tables — Stevens & Lewis model
# ==========================================================================
# Source: B. L. Stevens, F. L. Lewis, "Aircraft Control and Simulation", appendix A,
# themselves taken from NASA wind-tunnel tests (Nguyen et al., NASA TP-1538, 1979).
# Numerical values copied from the reference implementations of the model (identical
# between AeroBenchVVPython and f16-flight-dynamics).
#
# Units (those of the source, converted on load):
#   grid angles in DEGREES; coefficients non-dimensional;
#   thrusts in lbf, altitudes in ft (keys suffixed _lbf / _ft).
# Linear interpolation on uniform grids, linear extrapolation outside the grid
# (behavior of the original model).
#
# Sign conventions (standard): δe > 0 = trailing edge down -> nose-down moment;
# δa > 0 -> roll left (Cl < 0); δr > 0 -> yaw left (Cn < 0).
#
# Known limitation: the tables do not depend on Mach (low-speed data). Beyond
# roughly Mach 0.6, the 6-DOF model extrapolates subsonic physics.
# ==========================================================================

grids:
  alpha_deg: {start: -10.0, step: 5.0, count: 12}       # -10° … 45°
  elevator_deg: {start: -24.0, step: 12.0, count: 5}    # -24° … 24°
  beta_abs_deg: {start: 0.0, step: 5.0, count: 7}       # |β| 0° … 30° (Cl, Cn: odd functions of β)
  beta_deg: {start: -30.0, step: 10.0, count: 7}        # β -30° … 30°

