[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jetsim"
version = "0.1.0"
description = "F-16-like fighter-jet flight simulator: 3-DOF and 6-DOF (NASA tables) models, instruments, Tacview export, fly-by-wire and autopilot."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elouan Salaun" }]
keywords = ["flight-dynamics", "f-16", "6-dof", "simulation", "autopilot", "tacview"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = [
    "pygame>=2.5",  # manual flying with keyboard / joystick
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
notebooks = [
    "jupyterlab>=4.0",
]

[project.urls]
Repository = "https://github.com/elouansalaun/jetfighter-sim"

[tool.hatch.build.targets.wheel]
packages = ["src/jetsim"]

# --------------------------------------------------------------------------
# Outils
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "NPY", "RUF"]
ignore = [
    "N802", "N803", "N806",  # physics notation: T, P, C_bn, Ixx...
    "RUF001", "RUF002", "RUF003",  # Greek letters / special characters in docstrings
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
